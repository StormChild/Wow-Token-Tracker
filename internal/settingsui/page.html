<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WoW Token Tracker — Settings</title>
<style>
  :root { color-scheme: light dark; --accent: #2ecc71; --bad: #e74c3c; --muted: #888; }
  body { font: 15px/1.5 system-ui, "Segoe UI", sans-serif; max-width: 560px; margin: 2rem auto; padding: 0 1rem; }
  h1 { font-size: 1.4rem; margin-bottom: .25rem; }
  p.sub { color: var(--muted); margin-top: 0; }
  label { display: block; font-weight: 600; margin-top: 1rem; }
  .hint { font-weight: normal; color: var(--muted); font-size: .85rem; }
  input, select { width: 100%; box-sizing: border-box; padding: .5rem; font: inherit; margin-top: .25rem;
                  border: 1px solid #8886; border-radius: 6px; background: transparent; }
  .row { display: flex; gap: 1rem; } .row > div { flex: 1; }
  .buttons { display: flex; gap: .75rem; margin-top: 1.5rem; }
  button { font: inherit; padding: .55rem 1.2rem; border-radius: 6px; border: 1px solid #8886; cursor: pointer; background: transparent; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .msg { padding: .75rem 1rem; border-radius: 6px; margin: 1rem 0; border-left: 4px solid var(--accent); background: #2ecc7122; }
  .msg.err { border-color: var(--bad); background: #e74c3c22; }
  a { color: inherit; }
</style>
</head>
<body>
<h1>WoW Token Tracker</h1>
<p class="sub">Settings are stored on this PC only. The secret and webhook are kept in Windows Credential Manager.</p>

{{if .Msg}}<div class="msg{{if .IsErr}} err{{end}}" role="status">{{.Msg}}</div>{{end}}

<form method="post" action="/save">
  <input type="hidden" name="t" value="{{.Token}}">

  <label for="region">Region</label>
  <select id="region" name="region">
    {{range .Regions}}<option value="{{.}}"{{if eq . $.S.Region}} selected{{end}}>{{upper .}}</option>{{end}}
  </select>

  <label for="clientId">Client ID <span class="hint">— from develop.battle.net</span></label>
  <input id="clientId" name="clientId" value="{{.S.ClientID}}" autocomplete="off" spellcheck="false">

  <label for="clientSecret">Client Secret</label>
  <input id="clientSecret" name="clientSecret" type="password" autocomplete="off"
         placeholder="{{if .HasSecret}}saved — leave blank to keep{{else}}paste your client secret{{end}}">

  <label for="webhookUrl">Discord Webhook URL</label>
  <input id="webhookUrl" name="webhookUrl" type="password" autocomplete="off"
         placeholder="{{if .HasWebhook}}saved — leave blank to keep{{else}}https://discord.com/api/webhooks/…{{end}}">

  <div class="row">
    <div>
      <label for="thresholdGold">Alert threshold (gold)</label>
      <input id="thresholdGold" name="thresholdGold" value="{{.S.ThresholdGold}}" inputmode="numeric">
    </div>
    <div>
      <label for="pollMinutes">Check every (minutes)</label>
      <input id="pollMinutes" name="pollMinutes" value="{{.S.PollMinutes}}" inputmode="numeric">
    </div>
  </div>
  <p class="hint">Green when the price is under the threshold, red at or above. Discord is only messaged when it flips.</p>

  <div class="buttons">
    <button type="submit" formaction="/test">Test</button>
    <button type="submit" class="primary">Save</button>
  </div>
</form>
</body>
</html>
